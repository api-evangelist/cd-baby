aid: cd-baby
name: CD Baby
description: >-
  CD Baby is an independent music distribution and publishing administration
  service for songwriters, performers, and independent record labels. Founded
  in 1998 and now part of Downtown Music Holdings under Virgin Music Group,
  CD Baby services over 50 million music assets from creators in hundreds of
  countries across six continents. The platform distributes music to 150+
  digital service providers including Spotify, Apple Music, YouTube, Pandora,
  Tidal, TikTok, Amazon, Shazam, and Deezer, and is a flagship member of
  YouTube's Preferred Distributor Program plus a preferred partner with Apple
  and Spotify. Services include digital distribution, physical CD and vinyl
  manufacturing, publishing administration, cover song licensing, sync
  licensing through CDB Boost, YouTube and social monetization, performing
  rights organization (ASCAP, BMI, SOCAN) registration assistance, and
  promotion tools via SymphonyOS, HearNow, Show.co, Managed Ads, Groover,
  Laylo, and Internet Radio Airplay. Pricing is a one-time fee ($9.99 single,
  $14.99 album) with artists retaining over 90% of earnings. CD Baby has
  paid out more than $1 billion to artists. CD Baby has no public developer
  API, SDK, or open-source release; all distribution and reporting workflows
  are exposed only through the artist member portal at members.cdbaby.com.
